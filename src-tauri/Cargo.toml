[package]
name = "apexweb-pipeline-os"
version = "0.1.0"
description = "ApexWeb Pipeline OS"
authors = ["ApexWeb"]
license = "MIT"
repository = "https://github.com/bananamanadmin/apexweb-pipeline-os"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
